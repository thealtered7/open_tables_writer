kafka.bootstrap.servers=kafka:9092
kafka.topic=cdc-file-write
kafka.opentable.write.notifications=open-table-write-notifications
schema.registry.type=confluent
schema.registry.url=http://schema-registry:8081
schema.registry.auto.register=true
input.file.wait.max.seconds=10
input.file.wait.poll.millis=500
# Datapipelines write registration (POST /table-writes); blank base-url disables
datapipelines.http.base-url=http://datapipelines-app:8080
datapipelines.catalog.name=lakehouse
# When true, sign each request with an HS256 JWT (secret from DATAPIPELINES_JWT_SECRET_KEY)
datapipelines.http.jwt.enabled=false
